workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid duplicated pipelines (branch + merge request)
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # New version: the git tag gives the maven version
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
      variables:
        REVISION: $CI_COMMIT_TAG
    # Other tags (e.g. changeVersion2_4_1) do not trigger any pipeline
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - package
  - deploy
  - build-containers
  - release

default:
  tags:
    - stable

variables:
  REVISION: "0-SNAPSHOT"
  MAVEN_IMAGE: "maven:3.9-eclipse-temurin-17"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-s .m2/settings.xml --batch-mode -Drevision=$REVISION"
  TOOLBOX_JAR: "met4j-toolbox/target/met4j-toolbox-$REVISION.jar"
  PACKAGE_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/met4j-toolbox/$CI_COMMIT_TAG/met4j-toolbox.jar"

.maven:
  image: $MAVEN_IMAGE
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository/

# Jobs publishing a new version: only on X.Y.Z tags
.release_rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/

.release_needs:
  needs:
    - package
    - test
    - integration_test

test:
  extends: .maven
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS clean test
    - grep -o '<tfoot>.*</tfoot>' coverage/target/site/jacoco-aggregate/index.html
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"
      coverage_report:
        coverage_format: jacoco
        path: coverage/target/site/jacoco-aggregate/jacoco.xml

integration_test:
  extends: .maven
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS clean verify -DskipUTs=true
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: "**/target/failsafe-reports/TEST-*.xml"

package:
  extends: .maven
  stage: package
  script:
    - mvn $MAVEN_CLI_OPTS clean install -DskipTests
  artifacts:
    expire_in: 1 day
    paths:
      - $TOOLBOX_JAR

# Checks that the release profile (javadoc, sources) builds before tagging
verifyRelease:
  extends: .maven
  stage: package
  script:
    - mvn $MAVEN_CLI_OPTS -Prelease -Dgpg.skip -DskipTests clean verify
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(release|hotfix)\//
    # Branch pipelines are replaced by merge request pipelines when a MR is open
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^(release|hotfix)\//

deployJar:
  extends:
    - .release_rules
    - .release_needs
  stage: deploy
  image: curlimages/curl:8.10.1
  cache: []
  script:
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$TOOLBOX_JAR" "$PACKAGE_URL"'

deployCentral:
  extends:
    - .maven
    - .release_rules
  stage: deploy
  needs:
    - test
    - integration_test
  before_script:
    - which gpg || (apt-get update -qy && apt-get install -qqy gnupg)
    - export GPG_TTY=$(tty)
    - gpg --batch --import <(echo "$GPG_PRIVATE_KEY")
  script:
    - mvn $MAVEN_CLI_OPTS -Prelease clean deploy -DskipTests

buildSingularity:
  extends:
    - .release_rules
    - .release_needs
  stage: build-containers
  image:
    name: quay.io/singularity/singularity:v3.11.5-slim
    entrypoint: [ "" ]
  cache: []
  variables:
    SINGULARITY_IMAGE: "oras://$CI_REGISTRY_IMAGE/met4j-singularity"
  script:
    # Base image pulled anonymously from Docker Hub
    - singularity build met4j-toolbox.sif met4j.singularity
    # Registry credentials only for the GitLab registry
    - echo "$CI_REGISTRY_PASSWORD" | singularity remote login --username "$CI_REGISTRY_USER" --password-stdin "oras://$CI_REGISTRY"
    - singularity push met4j-toolbox.sif "$SINGULARITY_IMAGE:$CI_COMMIT_TAG"
    - singularity push met4j-toolbox.sif "$SINGULARITY_IMAGE:latest"

.template_docker:
  extends:
    - .release_rules
    - .release_needs
  stage: build-containers
  image: docker:28
  services:
    - docker:28-dind
  cache: []
  script:
    - docker build -t "$DOCKER_IMAGE:$CI_COMMIT_TAG" -t "$DOCKER_IMAGE:latest" .
    - docker push "$DOCKER_IMAGE:$CI_COMMIT_TAG"
    - docker push "$DOCKER_IMAGE:latest"

buildDockerProdGitlab:
  extends: .template_docker
  variables:
    DOCKER_IMAGE: "$CI_REGISTRY/metexplore/met4j/met4j-docker"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

buildDockerProdDockerhub:
  extends: .template_docker
  variables:
    DOCKER_IMAGE: $DOCKERHUB_IMAGE
  before_script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin $DOCKERHUB_REGISTRY

release:
  extends: .release_rules
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  cache: []
  needs:
    - deployJar
    - deployCentral
  script:
    # Release notes: the CHANGELOG.md section of this version
    - awk -v v="## $CI_COMMIT_TAG" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > release_notes.md
    - cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "met4j $CI_COMMIT_TAG"
    description: release_notes.md
    assets:
      links:
        - name: "met4j-toolbox.jar"
          url: $PACKAGE_URL
          link_type: package
        - name: "Docker and Singularity images"
          url: "$CI_PROJECT_URL/container_registry"
          link_type: image

# GitHub release on the mirror (MetExplore/met4j)
# Needs a masked CI variable GITHUB_TOKEN (fine-grained PAT, "Contents: write" on the repo)
releaseGithub:
  extends: .release_rules
  stage: release
  image: alpine:3.20
  cache: []
  needs:
    - package
    - release
  variables:
    GITHUB_REPO: "MetExplore/met4j"
    GITHUB_API: "https://api.github.com/repos/MetExplore/met4j"
  before_script:
    - apk add --no-cache curl jq
  script:
    - awk -v v="## $CI_COMMIT_TAG" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > release_notes.md
    - cat release_notes.md
    # Wait for the push mirror to bring the tag to GitHub (max 10 min),
    # so that the release is attached to the mirrored annotated tag
    - |
      for i in $(seq 1 60); do
        curl --silent --fail --output /dev/null -H "Authorization: Bearer $GITHUB_TOKEN" "$GITHUB_API/git/ref/tags/$CI_COMMIT_TAG" && break
        [ "$i" -eq 60 ] && { echo "Tag $CI_COMMIT_TAG not found on GitHub after 10 min"; exit 1; }
        echo "Waiting for the mirror to push $CI_COMMIT_TAG..."; sleep 10
      done
    # Create the release, or reuse it if the job is retried
    - |
      if curl --silent --fail --output release.json -H "Authorization: Bearer $GITHUB_TOKEN" "$GITHUB_API/releases/tags/$CI_COMMIT_TAG"; then
        echo "GitHub release already exists"
      else
        jq -n --arg tag "$CI_COMMIT_TAG" --rawfile body release_notes.md '{tag_name: $tag, name: ("met4j " + $tag), body: $body}' > release_request.json
        curl --silent --fail-with-body --output release.json -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" "$GITHUB_API/releases" -d @release_request.json || { cat release.json; exit 1; }
      fi
    - RELEASE_ID=$(jq -r .id release.json)
    - echo "GitHub release id $RELEASE_ID"
    # Replace the jar asset if it already exists
    - |
      for ASSET_ID in $(curl --silent --fail -H "Authorization: Bearer $GITHUB_TOKEN" "$GITHUB_API/releases/$RELEASE_ID/assets" | jq -r '.[] | select(.name == "met4j-toolbox.jar") | .id'); do
        curl --silent --fail -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" "$GITHUB_API/releases/assets/$ASSET_ID"
      done
    - |
      curl --silent --fail-with-body -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/java-archive" \
        --data-binary @"$TOOLBOX_JAR" "https://uploads.github.com/repos/$GITHUB_REPO/releases/$RELEASE_ID/assets?name=met4j-toolbox.jar" \
        | jq -r .browser_download_url
